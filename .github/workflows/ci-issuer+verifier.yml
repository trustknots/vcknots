name: CI issuer+verifier

on:
  pull_request:
    branches: ["main", "feat/oid4vci-1.0"]
    paths:
      - issuer\+verifier/**

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Debug checked out commit and file
        run: |
          git rev-parse HEAD
          git status --short
          grep -RIn "INVALID_CONFIGURATION" issuer+verifier/src || true
          nl -ba issuer+verifier/src/providers/issue-credential-jwt-vc-json.provider.ts | sed -n '20,50p'
          nl -ba issuer+verifier/src/errors/error.codes.ts | sed -n '50,65p'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run format
        run: |
          pnpm --filter ...@trustknots/vcknots format

      - name: Run lint
        run: |
          pnpm --filter ...@trustknots/vcknots lint

      - name: Build
        run: pnpm --filter ...@trustknots/vcknots build

      - name: Run tests
        run: |
          pnpm --filter ...@trustknots/vcknots test:ci
