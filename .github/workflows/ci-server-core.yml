name: CI server core

# server depends on issuer+verifier
on:
  pull_request:
    branches: ["main", "feat/oid4vci-1.0"]
    paths:
      - server/core/**

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format
        run: |
          pnpm --filter ...@trustknots/server-core format

      - name: Run lint
        run: |
          pnpm --filter ...@trustknots/server-core lint

      - name: Build
        run: pnpm --filter ...@trustknots/server-core... build
