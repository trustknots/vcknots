name: Create release tag and npm publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: "pnpm"

      - name: Install dependencies
        run: |
          # care npm Trusted Publish Auth
          npm install -g npm@latest
          pnpm install

      - name: Build
        run: |
          pnpm build

      - name: Print publish config
        run: |
          npm --version
          npm pkg get name
          npm pkg get version
          npm config get registry
          echo "OIDC_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}"

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm changeset publish

      - name: Push release tags
        run: |
          git remote -v
          git tag
          git show-ref --tags
          git push origin --tags

      - name: Notify Slack on Workflow Failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 *GitHub Actions エラー発生*\n*リポジトリ:* ${{ github.repository }}\n*ワークフロー:* ${{ github.workflow }}\n*実行ログ:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|ログを確認する>"
